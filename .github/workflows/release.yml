name: Release

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            bin_name: leetcodedaily
          - label: macos-aarch64
            runner: macos-14
            bin_name: leetcodedaily

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare artifact name
        id: artifact
        shell: bash
        run: |
          artifact_ref="${GITHUB_REF_NAME//\//-}"
          echo "name=leetcodedaily-${artifact_ref}-${{ matrix.label }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package binary
        shell: bash
        run: |
          mkdir -p release-root
          cp target/release/${{ matrix.bin_name }} release-root/
          cp README.md release-root/
          cp -R scripts release-root/
          tar -czf "${{ steps.artifact.outputs.name }}" -C release-root .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: ${{ steps.artifact.outputs.name }}

  build-web:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Build wasm bundle
        run: |
          cargo build --release --target wasm32-unknown-unknown --locked --lib
          mkdir -p dist/web
          wasm-bindgen \
            --target web \
            --out-dir dist/web \
            target/wasm32-unknown-unknown/release/leetcodedaily.wasm
          cp web/index.html dist/web/index.html

      - name: Prepare artifact name
        id: artifact
        shell: bash
        run: |
          artifact_ref="${GITHUB_REF_NAME//\//-}"
          echo "name=leetcodedaily-${artifact_ref}-web.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package web bundle
        run: |
          tar -czf "${{ steps.artifact.outputs.name }}" -C dist/web .

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ steps.artifact.outputs.name }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - build-native
      - build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
