<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeetCode Daily Composer</title>
  <style>
    :root {
      color-scheme: dark;
      background: #080e17;
      font-family: "DejaVu Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(255, 194, 85, 0.08), transparent 38%),
        linear-gradient(180deg, #101c2d 0%, #080e17 100%);
      padding: 24px;
    }

    .app-host {
      position: relative;
      display: grid;
      place-items: center;
      max-width: 100%;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 24px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
    }

    .app-status,
    .app-error {
      position: absolute;
      left: 50%;
      bottom: 28px;
      width: min(560px, calc(100vw - 64px));
      transform: translateX(-50%);
      border-radius: 8px;
      padding: 14px 16px;
      color: #f8fafc;
      background: rgba(3, 7, 18, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.34);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .app-error {
      color: #fee2e2;
      border-color: rgba(248, 113, 113, 0.45);
      background: rgba(69, 10, 10, 0.88);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="app-host" aria-live="polite">
    <canvas id="app-canvas" aria-label="LeetCode Daily Composer"></canvas>
    <div id="app-status" class="app-status">Loading LeetCode Daily Composer...</div>
    <div id="app-error" class="app-error" hidden></div>
  </main>
  <script type="module">
    import init from "./leetcodedaily.js";

    const status = document.getElementById("app-status");
    const error = document.getElementById("app-error");

    const messageFrom = (value) => {
      if (!value) {
        return "Unknown startup error.";
      }
      if (value instanceof Error) {
        return value.message || String(value);
      }
      return String(value);
    };

    const showError = (value) => {
      const message = messageFrom(value);
      document.documentElement.dataset.appState = "error";
      if (status) {
        status.hidden = true;
      }
      if (error) {
        error.textContent = `Unable to start the app: ${message}`;
        error.hidden = false;
      }
    };

    window.addEventListener("error", (event) => {
      showError(event.error || event.message);
    });

    window.addEventListener("unhandledrejection", (event) => {
      showError(event.reason);
    });

    try {
      await init();
    } catch (err) {
      showError(err);
    }
  </script>
</body>
</html>
