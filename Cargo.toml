[package]
name = "leetcodedaily"
version = "0.1.43"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.102"
chrono = "0.4.45"
cranpose-animation = "0.1.58"
cranpose-core = "0.1.58"
cranpose-foundation = "0.1.58"
image = "0.25.10"
imageproc = "0.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
cranpose = { version = "0.1.58", default-features = false, features = ["desktop", "renderer-wgpu", "robot"] }
webp = "0.3.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cranpose = { version = "0.1.58", default-features = false, features = ["web", "renderer-wgpu"] }
# Cranpose pulls getrandom 0.3 through ahash; browser wasm needs its JS backend.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.99"
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.99", features = [
    "CanvasRenderingContext2d",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardItem",
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "ImageData",
    "Navigator",
    "Node",
    "Storage",
    "Url",
    "Window",
] }

# Keep `cargo run` usable for the Cranpose/WGPU UI; fully unoptimized
# dev builds are too slow for interactive work.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3
