[package]
name = "leetcodedaily"
version = "0.1.52"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
chrono = "0.4.45"
# Exact pins across every Cranpose crate. The framework is pre-alpha and
# states no compatibility policy, so a caret range can mix one crate from this
# release with a sibling from the next and break at link time rather than at
# resolve time. Move them together or not at all.
#
# The blank window that first forced these pins (Cranpose#634, the whole UI
# missing behind the background gradient) is fixed in 0.1.118: a layer whose
# content outgrew the surface budget was dropped whole instead of falling back
# to its own box.
cranpose-animation = "=0.1.138"
cranpose-core = "=0.1.138"
cranpose-foundation = "=0.1.138"
image = "0.25.10"
imageproc = "0.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
base64 = "0.23.1"
cranpose = { version = "=0.1.138", default-features = false, features = ["desktop", "renderer-wgpu", "robot"] }
webp = "0.3.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cranpose = { version = "=0.1.138", default-features = false, features = ["web", "renderer-wgpu"] }
# Cranpose pulls getrandom 0.3 through ahash; browser wasm needs its JS backend.
# Keep this on the 0.3 line: it exists to configure *that* copy, not the 0.4 one.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = [
    "CanvasRenderingContext2d",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardItem",
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "ImageData",
    "Navigator",
    "Node",
    "Storage",
    "Url",
    "Window",
] }

# Keep `cargo run` usable for the Cranpose/WGPU UI; fully unoptimized
# dev builds are too slow for interactive work.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3
