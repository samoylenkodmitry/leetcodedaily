[package]
name = "leetcodedaily"
version = "0.1.24"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.102"
chrono = "0.4.44"
cranpose-animation = "0.0.65"
cranpose-core = "0.0.65"
cranpose-foundation = "0.0.65"
image = "0.25.10"
imageproc = "0.26.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
cranpose = { version = "0.0.65", default-features = false, features = ["desktop", "renderer-wgpu", "robot"] }
webp = "0.3.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cranpose = { version = "0.0.65", default-features = false, features = ["web", "renderer-wgpu"] }
js-sys = "0.3.98"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "CanvasRenderingContext2d",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardItem",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "ImageData",
    "Navigator",
    "Node",
    "Storage",
    "Url",
    "Window",
] }

# Keep `cargo run` usable for the Cranpose/WGPU UI; fully unoptimized
# dev builds are too slow for interactive work.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3
