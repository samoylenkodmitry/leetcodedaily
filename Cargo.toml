[package]
name = "leetcodedaily"
version = "0.1.49"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
chrono = "0.4.45"
# Cranpose is pinned to =0.1.117: 0.1.116 (render refactor, Cranpose#617)
# renders only the background gradient — the whole UI is missing, on both the
# headless robot and a live window. Exact pins keep the broken 0.1.116 out of
# the subtree too, since cranpose 0.1.117 accepts ^0.1.117 for its siblings.
cranpose-animation = "=0.1.117"
cranpose-core = "=0.1.117"
cranpose-foundation = "=0.1.117"
image = "0.25.10"
imageproc = "0.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
base64 = "0.23.1"
cranpose = { version = "=0.1.117", default-features = false, features = ["desktop", "renderer-wgpu", "robot"] }
webp = "0.3.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cranpose = { version = "=0.1.117", default-features = false, features = ["web", "renderer-wgpu"] }
# Cranpose pulls getrandom 0.3 through ahash; browser wasm needs its JS backend.
# Keep this on the 0.3 line: it exists to configure *that* copy, not the 0.4 one.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = [
    "CanvasRenderingContext2d",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardItem",
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "ImageData",
    "Navigator",
    "Node",
    "Storage",
    "Url",
    "Window",
] }

# Keep `cargo run` usable for the Cranpose/WGPU UI; fully unoptimized
# dev builds are too slow for interactive work.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3
